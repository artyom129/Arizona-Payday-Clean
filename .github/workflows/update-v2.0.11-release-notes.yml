name: Update v2.0.11 release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-v2.0.11-release-notes.yml'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
          # Arizona Payday Clean v2.0.11

          Главное обновление версии — исправлен учёт талонов AZ Coins и повышена стабильность обработки Payday.

          ## 🐛 Исправлено

          - Исправлена главная причина, по которой талоны не зачислялись: `string.lower()` не переводил кириллицу CP1251, поэтому слово `Талон` не распознавалось.
          - Добавлен точный разбор серверной строки: `Вам был добавлен предмет Талон: +1 AZ Coins (3 шт.)`.
          - Исправлено отображение серверной активности в Telegram-команде `/status`: время больше не зависает на «0 минут назад».
          - Payday без начисленной зарплаты больше не считается обычной выплатой и не искажает множитель или прогноз окупаемости.
          - Улучшен сбор данных Payday: скрипт дожидается связанных строк банка, депозита, AZ Coins и зарплаты перед сохранением результата.

          ## ✨ Добавлено и улучшено

          - Талоны теперь отслеживаются сразу в нескольких источниках: серверный чат, GameText, TextDraw и диалоги.
          - Добавлена общая защита от двойного зачисления одного талона из разных источников.
          - Поддерживаются 6- и 8-значные цветовые теги в серверных сообщениях.
          - После успешного учёта талона скрипт выводит подтверждение в игровой чат.
          - Улучшена очередь Telegram-запросов: ответы на команды получают приоритет, а зависшие запросы завершаются быстрее.
          - Обновлена обработка частичного Payday и сохранение его состояния.
          - Релиз очищен от лишних файлов: ZIP содержит только `ArizonaPaydayClean.lua`.

          ## 📦 Установка и обновление

          1. Полностью закрой игру.
          2. Скачай `ArizonaPaydayClean.lua` или архив `ArizonaPaydayClean_v2.0.11_CLEAN.zip` ниже.
          3. Удали старый Lua-файл скрипта из папки `moonloader`.
          4. Помести новый `ArizonaPaydayClean.lua` в `moonloader`.
          5. Запусти игру.

          > Не удаляй `moonloader/config/ArizonaPaydayClean.ini` — в нём хранятся настройки Telegram, статистика и прогресс окупаемости.

          > В папке `moonloader` должна оставаться только одна версия скрипта.

          ## 📥 Файлы

          - `ArizonaPaydayClean.lua` — готовый скрипт для установки.
          - `ArizonaPaydayClean_v2.0.11_CLEAN.zip` — чистый архив с тем же Lua-файлом.
          RELEASE_NOTES

          gh release edit "v2.0.11" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Arizona Payday Clean v2.0.11" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
