name: Publish v2.0.13 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.0.13.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release file
        shell: bash
        run: |
          test "$(sha256sum ArizonaPaydayClean.lua | cut -d ' ' -f 1)" = "b91a97f7d7e73ca14b53e0c9cae3a62523234b19f9620e3fcb2bab4aecadec2c"
          grep -aFq "local SCRIPT_VERSION = '2.0.13'" ArizonaPaydayClean.lua

      - name: Remove temporary release workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v2.0.13.yml
          git commit -m "Remove temporary v2.0.13 release workflow"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_sha="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Исправление мини-окна в v2.0.13

          В `v2.0.12` режим перемещения включался, но само окно могло оставаться неподвижным. Причина: мини-окно использует `NoDecoration`, поэтому у него нет стандартного заголовка, за который ImGui перемещает окна.

          ### Что исправлено

          - Добавлена собственная drag-зона в верхней части мини-окна.
          - Перемещение выполняется вручную через `SetWindowPosVec2` и не зависит от настроек конкретной сборки `mimgui`.
          - Отключено встроенное перемещение ImGui, чтобы исключить двойной сдвиг.
          - Во время перетаскивания корректно блокируется управление персонажем.
          - Новая позиция ограничивается границами экрана и сохраняется в `ArizonaPaydayClean.ini`.

          ### Как переместить окно

          1. Введите `/paymini`.
          2. Зажмите левую кнопку мыши на верхней полосе с надписью **«ЗАЖМИ И ТАЩИ ЗДЕСЬ»**.
          3. Перетащите окно в нужное место.
          4. Нажмите **«Готово»**, `ESC` или снова введите `/paymini`.

          Для возврата в стандартную позицию используйте `/paymini reset`.

          ### Установка

          Скачайте единственный файл `ArizonaPaydayClean.lua` из **Assets**, замените старую версию в папке `moonloader` и оставьте только один Lua-файл скрипта. Конфигурацию `ArizonaPaydayClean.ini` удалять не нужно.
          EOF
          gh release create v2.0.13 ArizonaPaydayClean.lua \
            --repo "$GITHUB_REPOSITORY" \
            --target "$release_sha" \
            --title "Arizona Payday Clean v2.0.13" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
