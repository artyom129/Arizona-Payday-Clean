name: Publish v2.0.14 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.0.14.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release file
        shell: bash
        run: |
          test "$(sha256sum ArizonaPaydayClean.lua | cut -d ' ' -f 1)" = "138ec882f4ef8c98e4adfb7e8947a807751f1e0c568c3d90ea6a063225013989"
          grep -aFq "local SCRIPT_VERSION = '2.0.14'" ArizonaPaydayClean.lua

      - name: Remove temporary release workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v2.0.14.yml
          git commit -m "Remove temporary v2.0.14 release workflow"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_sha="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Срочное исправление совместимости v2.0.14

          Версия 2.0.13 могла завершать работу скрипта на некоторых игровых сборках `mimgui`. Экспериментальные ручные вызовы мыши и перемещения полностью удалены, а код возвращён на проверенную загружаемую основу 2.0.12.

          ### Что исправлено

          - Удалены `SetWindowPosVec2`, ручная drag-зона и дополнительные mouse-drag вызовы из 2.0.13.
          - Режим `/paymini` теперь использует обычный заголовок ImGui и штатное перемещение окна.
          - В пассивном режиме заголовок скрыт, а оверлей не принимает ввод.
          - Высота режима настройки увеличена, чтобы элементы не перекрывались.
          - Позиция сохраняется после **«Готово»**, `ESC` или повторного `/paymini`.

          ### Как переместить мини-окно

          1. Введите `/paymini`.
          2. Зажмите появившийся верхний заголовок **«Перетащи мини-окно»**.
          3. Переместите окно и нажмите **«Готово»**.

          `/paymini reset` возвращает окно в стандартную позицию.

          ### Установка

          Скачайте `ArizonaPaydayClean.lua` из **Assets**, замените старый файл в `moonloader` и не удаляйте `moonloader/config/ArizonaPaydayClean.ini`.
          EOF
          gh release create v2.0.14 ArizonaPaydayClean.lua \
            --repo "$GITHUB_REPOSITORY" \
            --target "$release_sha" \
            --title "Arizona Payday Clean v2.0.14" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
